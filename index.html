<!DOCTYPE html>
<!--
  On "Someone Close"
  January 13, 2026

  You just stared at sand falling for three minutes. Congratulations.
  You've now spent more focused attention on one thing than most people
  spend on their families in a week.

  Here's the thing nobody tells you about the attention economy: you're
  the product, but you're also paying for the privilege of being sold.
  It's like a restaurant where you're both the customer and the meal.
  Except the restaurant is TikTok and the chef is an algorithm that
  knows you better than your therapist.

  The business model is simple. Tech companies hire the smartest engineers
  on the planet, pay them $400,000 a year, and ask them one question:
  "How do we make people scroll slightly longer?" That's it. A generation
  of geniuses, optimizing thumb movement.

  Meanwhile, your boss sends emails at 11 PM about "work-life balance."
  This is not a contradiction. In corporate logic, work-life balance means
  you should feel balanced while working all the time. They've also
  discovered that exhausted employees make excellent consumers.

  The gambling industry figured this out decades ago. Give them a little
  candy, take their soul. Now every app is a slot machine. Notifications
  are pull levers. Your phone is a casino that also makes calls.

  And now we have AI-generated content. Millions of articles, images, and
  videos created by machines for no reason except that empty feeds look bad.
  It's not content. It's filler. Digital sawdust.

  So some guy made a website where sand falls down and then tells you to go
  talk to a real person. That's the whole thing. No signup. No newsletter.
  No "ring the bell for notifications." Just sand, then a guilt trip.

  The funny part is it works. Not because it's clever, but because three
  minutes of doing nothing feels like rebellion now. We've built a world
  where staring at falling sand is a radical act.

  Here's my prediction: you're going to close this tab and open another one.
  You're not going to call your mom. You're not going to step outside.
  You're going to scroll. I'm going to scroll. We all know this.

  But for three minutes, you didn't. That's something.
  It's not much. But the bar is underground at this point, so I'll take it.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>close</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1614;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>


  <script>
    const CONFIG = {
      cellSize: window.innerWidth < 768 ? 1 : 2,
      startDelay: 2, // seconds before draining begins
      totalDuration: 180, // seconds
      sandColors: [
        '#E8D4B8', // lightest sand
        '#DFC9A8', // very light sand
        '#D4B896', // light sand
        '#C9AD7C', // light golden sand
        '#BFA172', // golden sand
        '#B08D5C', // warm sand
        '#A68255', // amber sand
        '#967545', // dark amber
        '#876838', // dark sand
      ],
      backgroundColor: '#1a1614',
      textColor: '#f4efe4',
      messages: [
        { text: 'Attention is a gift', yPercent: 0.22 },
        { text: 'You just gave two minutes of yours', yPercent: 0.50 },
        { text: 'Three. Who needs them more?', yPercent: 0.78 }
      ],
      font: {
        family: 'Cormorant Garamond, Georgia, serif',
        sizeVw: 3,
        minSize: 24,
        maxSize: 44
      },
      byline: {
        text: 'by noid',
        yPercent: 0.5,
        sizeVw: 4,
        minSize: 36,
        maxSize: 56
      }
    };

    let canvas, ctx;
    let cols, rows;
    let grid = []; // 0 = empty, 1-9 = sand color index
    let textMap = []; // true if cell has text beneath
    let elapsedTime = 0;
    let lastFrameTime = null;
    let remainingSand = 0;
    let imageData = null;
    let colOrder = []; // randomized column order for physics

    // Pre-parse colors to RGB
    const sandRGB = CONFIG.sandColors.map(hex => ({
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    }));

    const bgRGB = {
      r: parseInt(CONFIG.backgroundColor.slice(1, 3), 16),
      g: parseInt(CONFIG.backgroundColor.slice(3, 5), 16),
      b: parseInt(CONFIG.backgroundColor.slice(5, 7), 16)
    };

    const textRGB = {
      r: parseInt(CONFIG.textColor.slice(1, 3), 16),
      g: parseInt(CONFIG.textColor.slice(3, 5), 16),
      b: parseInt(CONFIG.textColor.slice(5, 7), 16)
    };

    function init() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');

      resize();
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) lastFrameTime = performance.now();
      });

      requestAnimationFrame(animate);
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      CONFIG.cellSize = width < 768 ? 1 : 2;

      canvas.width = width;
      canvas.height = height;

      cols = Math.ceil(width / CONFIG.cellSize);
      rows = Math.ceil(height / CONFIG.cellSize);

      // Create text map and author map (bylineMap only needed during init)
      textMap = createCellMap(width, height, CONFIG.messages, CONFIG.font);
      const bylineMap = createCellMap(width, height, [CONFIG.byline], CONFIG.byline);

      initializeGrid(bylineMap);
      colOrder = [...Array(cols).keys()];
      imageData = ctx.createImageData(canvas.width, canvas.height);

      for (let i = 0; i < imageData.data.length; i += 4) {
        imageData.data[i] = bgRGB.r;
        imageData.data[i + 1] = bgRGB.g;
        imageData.data[i + 2] = bgRGB.b;
        imageData.data[i + 3] = 255;
      }

      remainingSand = rows * cols;
      elapsedTime = 0;
      lastFrameTime = null;
      renderAll();
    }

    function createCellMap(width, height, items, fontConfig) {
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const ctx = offscreen.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      let fontSize = Math.round(width * fontConfig.sizeVw / 100);
      fontSize = Math.max(fontConfig.minSize, Math.min(fontConfig.maxSize, fontSize));

      ctx.fillStyle = '#000000';
      ctx.font = `${fontSize}px ${CONFIG.font.family}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      items.forEach(item => {
        ctx.fillText(item.text, width / 2, height * item.yPercent);
      });

      const imgData = ctx.getImageData(0, 0, width, height);
      const map = [];
      for (let row = 0; row < rows; row++) {
        map[row] = [];
        for (let col = 0; col < cols; col++) {
          const x = Math.min(col * CONFIG.cellSize + Math.floor(CONFIG.cellSize / 2), width - 1);
          const y = Math.min(row * CONFIG.cellSize + Math.floor(CONFIG.cellSize / 2), height - 1);
          const idx = (y * width + x) * 4;
          map[row][col] = imgData.data[idx] < 128;
        }
      }
      return map;
    }

    function initializeGrid(bylineMap) {
      grid = [];

      // Noise function for organic patterns
      const noise = (x, y, seed) => {
        const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
        return n - Math.floor(n);
      };

      const seed = Math.random() * 1000;

      for (let row = 0; row < rows; row++) {
        grid[row] = [];
        const rowPercent = row / rows;

        for (let col = 0; col < cols; col++) {
          const colPercent = col / cols;

          // Diagonal gradient (top-left light to bottom-right dark)
          let centerValue = (rowPercent * 0.6 + colPercent * 0.4);

          // Add sweeping curves like wind patterns
          centerValue += Math.sin(colPercent * Math.PI * 2 + rowPercent * 1.5) * 0.08;
          centerValue += Math.cos(rowPercent * Math.PI * 3 - colPercent * 2) * 0.05;

          // Add swirl effect from center
          const dx = colPercent - 0.5;
          const dy = rowPercent - 0.5;
          const angle = Math.atan2(dy, dx);
          const dist = Math.sqrt(dx * dx + dy * dy);
          centerValue += Math.sin(angle * 2 + dist * 4) * 0.06;

          // Add medium-scale noise for organic patches
          centerValue += (noise(col * 0.012, row * 0.012, seed) - 0.5) * 0.1;

          // Add fine ripples
          centerValue += (noise(col * 0.04, row * 0.02, seed + 50) - 0.5) * 0.05;

          centerValue = Math.max(0, Math.min(1, centerValue));

          const centerIndex = Math.floor(centerValue * (sandRGB.length - 1));

          // Add local grain variation: ±2 from center
          const localVariation = Math.floor(Math.random() * 5) - 2;
          let colorIndex = centerIndex + localVariation;

          // Shift color for author signature (lighter = more visible)
          if (bylineMap[row]?.[col]) {
            colorIndex -= 6;
          }

          colorIndex = Math.max(0, Math.min(sandRGB.length - 1, colorIndex));

          grid[row][col] = colorIndex + 1;
        }
      }
    }

    function animate(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;

      if (!document.hidden) {
        const delta = timestamp - lastFrameTime;
        elapsedTime += delta;

        // Calculate drain progress (only after start delay)
        const drainTime = Math.max(0, elapsedTime - CONFIG.startDelay * 1000);
        const progress = Math.min(drainTime / (CONFIG.totalDuration * 1000), 1);
        const total = rows * cols;
        const targetDrained = Math.floor(total * progress);
        const drainedSoFar = total - remainingSand;
        const toDrain = targetDrained - drainedSoFar;

        updatePhysics();

        if (toDrain > 0) {
          drainSand(toDrain);
        } else if (progress >= 1) {
          // After timer, drain remaining sand gradually
          drainSand(Math.ceil(cols / 30));
        }

        renderChanges();
      }

      lastFrameTime = timestamp;

      if (remainingSand > 0) {
        requestAnimationFrame(animate);
      } else {
        document.title = 'Someone close';
        document.getElementById('favicon').href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>";
      }
    }

    let changedCells = []; // track cells that changed this frame

    function updatePhysics() {
      changedCells = [];

      // Shuffle column order each frame for even distribution
      for (let i = colOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colOrder[i], colOrder[j]] = [colOrder[j], colOrder[i]];
      }

      const bylineRow = Math.floor(rows * CONFIG.byline.yPercent);

      // Process from bottom to top, columns in random order
      for (let row = rows - 2; row >= 0; row--) {
        for (const col of colOrder) {
          const sand = grid[row][col];
          if (sand === 0) continue;

          // Fade byline: light grains below byline gradually darken
          if (row >= bylineRow && sand <= 3 && Math.random() < 0.003) {
            grid[row][col]++;
            changedCells.push({ row, col });
          }

          let destRow = -1, destCol = -1;

          if (grid[row + 1][col] === 0) {
            destRow = row + 1;
            destCol = col;
          } else {
            const dirs = Math.random() < 0.5 ? [-1, 1] : [1, -1];
            for (const dir of dirs) {
              const newCol = col + dir;
              if (newCol >= 0 && newCol < cols && grid[row + 1][newCol] === 0) {
                destRow = row + 1;
                destCol = newCol;
                break;
              }
            }
          }

          if (destRow !== -1) {
            grid[destRow][destCol] = sand;
            grid[row][col] = 0;
            changedCells.push({ row: destRow, col: destCol });
            changedCells.push({ row, col });
          }
        }
      }
    }

    function drainSand(count) {
      const bottomRow = rows - 1;
      let drained = 0;
      for (const col of colOrder) {
        if (drained >= count) break;
        if (grid[bottomRow][col] !== 0) {
          grid[bottomRow][col] = 0;
          changedCells.push({ row: bottomRow, col });
          remainingSand--;
          drained++;
        }
      }
    }

    function renderAll() {
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          renderCell(row, col);
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function renderChanges() {
      for (const { row, col } of changedCells) {
        renderCell(row, col);
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function renderCell(row, col) {
      const cellValue = grid[row][col];

      let r, g, b;

      // Bottom row is invisible "drain zone" - always background
      if (row === rows - 1) {
        r = bgRGB.r;
        g = bgRGB.g;
        b = bgRGB.b;
      } else if (cellValue === 0) {
        if (textMap[row] && textMap[row][col]) {
          r = textRGB.r;
          g = textRGB.g;
          b = textRGB.b;
        } else {
          r = bgRGB.r;
          g = bgRGB.g;
          b = bgRGB.b;
        }
      } else {
        const color = sandRGB[cellValue - 1];
        r = color.r;
        g = color.g;
        b = color.b;
      }

      const startX = col * CONFIG.cellSize;
      const startY = row * CONFIG.cellSize;
      const canvasWidth = canvas.width;
      const data = imageData.data;

      // Calculate valid pixel range (avoid per-pixel bounds check)
      const endX = Math.min(startX + CONFIG.cellSize, canvasWidth);
      const endY = Math.min(startY + CONFIG.cellSize, canvas.height);

      for (let pixelY = startY; pixelY < endY; pixelY++) {
        for (let pixelX = startX; pixelX < endX; pixelX++) {
          const idx = (pixelY * canvasWidth + pixelX) * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
        }
      }
    }

    init();
  </script>
</body>
</html>
