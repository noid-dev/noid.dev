<!--
  On "Someone Close"
  January 13, 2026

  You just stared at sand falling for three minutes. Congratulations.
  You've now spent more focused attention on one thing than most people
  spend on their families in a week.

  Here's the thing nobody tells you about the attention economy: you're
  the product, but you're also paying for the privilege of being sold.
  It's like a restaurant where you're both the customer and the meal.
  Except the restaurant is TikTok and the chef is an algorithm that
  knows you better than your therapist.

  The business model is simple. Tech companies hire the smartest engineers
  on the planet, pay them $400,000 a year, and ask them one question:
  "How do we make people scroll slightly longer?" That's it. A generation
  of geniuses, optimizing thumb movement.

  Meanwhile, your boss sends emails at 11 PM about "work-life balance."
  This is not a contradiction. In corporate logic, work-life balance means
  you should feel balanced while working all the time. They've also
  discovered that exhausted employees make excellent consumers.

  The gambling industry figured this out decades ago. Give them a little
  candy, take their soul. Now every app is a slot machine. Notifications
  are pull levers. Your phone is a casino that also makes calls.

  And now we have AI-generated content. Millions of articles, images, and
  videos created by machines for no reason except that empty feeds look bad.
  It's not content. It's filler. Digital sawdust.

  So some guy made a website where sand falls down and then tells you to go
  talk to a real person. That's the whole thing. No signup. No newsletter.
  No "ring the bell for notifications." Just sand, then a guilt trip.

  The funny part is it works. Not because it's clever, but because three
  minutes of doing nothing feels like rebellion now. We've built a world
  where staring at falling sand is a radical act.

  Here's my prediction: you're going to close this tab and open another one.
  You're not going to call your mom. You're not going to step outside.
  You're going to scroll. I'm going to scroll. We all know this.

  But for three minutes, you didn't. That's something.
  It's not much. But the bar is underground at this point, so I'll take it.
-->
